<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaterAligator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=close"
    />
  </head>
  <body>
    <input type="text" id="input" placeholder="Link" />
    <section id="buttons">
      <button class="btn" id="saveInput">Save Input</button>
      <button id="saveTab" class="btn" id="saveTab">Save Tab</button>
      <button id="clearAll" class="btn" id="clearAll">Clear All</button>
    </section>
    <section id="links">
      <ul id="ul"></ul>
    </section>
    <script src="script.js"></script>
  </body>
</html>
